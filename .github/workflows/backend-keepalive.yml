name: Backend Keep-Alive

on:
  schedule:
    - cron: '*/10 6-22 * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Backend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BACKEND_URL: ${{ secrets.BACKEND_URL || 'https://portfolio-k7acescoa-johns-projects-75897040.vercel.app/' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Ping Backend
        id: ping
        timeout-minutes: 2
        run: |
          echo "🔄 Pinging backend at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "Target URL: ${{ env.BACKEND_URL }}"
          
          CURL_OPTS=(
            "-s"
            "-o" "/dev/null"
            "-w" "%{http_code}"
            "--max-time" "30"
            "--retry" "2"
            "--retry-delay" "5"
          )
          
          set +e
          RESPONSE=$(curl "${CURL_OPTS[@]}" "${{ env.BACKEND_URL }}")
          CURL_EXIT_CODE=$?
          set -e
          
          if [ $CURL_EXIT_CODE -ne 0 ]; then
            echo "❌ Error: curl failed with exit code $CURL_EXIT_CODE"
            exit 1
          fi
          
          if [[ "$RESPONSE" =~ ^(200|301|302)$ ]]; then
            echo "✅ Success! Backend responded with status: $RESPONSE"
          else
            echo "❌ Error! Backend responded with status: $RESPONSE"
            exit 1
          fi
