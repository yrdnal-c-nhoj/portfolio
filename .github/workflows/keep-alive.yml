name: Keep Backend Alive

on:
  schedule:
    # Runs every 10 minutes between 6am and 10pm UTC (1am-5pm EST)
    - cron: '*/10 6-22 * * *'
  # Allow manual triggers from the GitHub UI
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: ${{ secrets.VERCEL_BACKEND_URL || 'https://portfolio-k7acescoa-johns-projects-75897040.vercel.app/' }}
    steps:
      - name: Ping Backend
        run: |
          echo "🔄 Pinging ${{ env.BACKEND_URL }} at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          
          # Make the request with a timeout and capture the response
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 ${{ env.BACKEND_URL }})
          
          # Check if the request was successful
          if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 301 ] || [ "$RESPONSE" -eq 302 ]; then
            echo "✅ Success! Backend responded with status: $RESPONSE"
          else
            echo "❌ Error! Backend responded with status: $RESPONSE"
            exit 1
          fi
