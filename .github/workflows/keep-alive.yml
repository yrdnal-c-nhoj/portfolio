name: Keep Backend Alive

on:
  schedule:
    # Runs every 10 minutes between 6am and 10pm UTC (1am-5pm EST)
    - cron: '*/10 6-22 * * *'
  # Allow manual triggers from the GitHub UI
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend
        run: |
          # Replace with your actual backend URL
