          BACKEND_URL="https://portfolio-k7acescoa-johns-projects-75897040.vercel.app/"
          
          echo "🔄 Pinging $BACKEND_URL at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          
          # Make the request and capture the response
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" $BACKEND_URL)
          
          # Check if the request was successful
          if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 301 ] || [ "$RESPONSE" -eq 302 ]; then
            echo "✅ Success! Backend responded with status: $RESPONSE"
          else
            echo "❌ Error! Backend responded with status: $RESPONSE"
            exit 1
          fi
